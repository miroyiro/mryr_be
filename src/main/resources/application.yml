# 공통 설정. 비밀 값은 전부 환경변수 (.env.example 참고). 프로필: local / prod
spring:
  application:
    name: miroyiro-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-init-sql: SET TIME ZONE 'Asia/Seoul'
  jpa:
    open-in-view: false           # 트랜잭션 밖 지연 로딩 금지 (N+1 숨김 방지)
    hibernate:
      ddl-auto: none              # 스키마는 Flyway 만 바꾼다. 엔티티 이식 끝나면 validate 로 올리기
    properties:
      hibernate:
        default_schema: miroyiro_main
        jdbc.time_zone: Asia/Seoul
  flyway:
    enabled: true
    schemas: miroyiro_main        # 스키마 생성 + flyway_schema_history 위치
    default-schema: miroyiro_main
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE   # 06 규칙: body/response = snake_case
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false    # ISO 8601 (+09:00)

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework     # nginx/ALB 뒤에서 X-Forwarded-* 반영

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

miroyiro:
  internal:
    key: ${INTERNAL_KEY:}                 # 비어 있으면 /internal/** 전부 401. scrap → backend /internal/** (X-Internal-Key)
  scrap:
    base-url: ${SCRAP_BASE_URL:http://localhost:8000}
    internal-key: ${SCRAP_INTERNAL_KEY:}  # backend → scrap
  jwt:
    secret: ${JWT_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
